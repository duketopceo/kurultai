name: argus-reviewer PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    # 'labeled' fires on EVERY label — only argus-probe is the fork-gate
    # signal worth a full review run.
    if: github.event.action != 'labeled' || github.event.label.name == 'argus-probe'
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
      statuses: write
    steps:
      # Don't persist the token into .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so the secrets lane diffs against the merge base
          # locally (it falls back to fetching the base SHA when absent).
          fetch-depth: 0

      # Full-SHA pin (v0.2.0) — a mutable tag could be retagged to swap code
      # running beside secrets.OPENROUTER_API_KEY + write scopes.
      - uses: duketopceo/Argus/action@27887be6438ad284566073835939210edc4cdeb8 # v0.5.0
        id: review
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # Install the CLI from the npm tarball (ships dist/), not the
          # action-ref folder pack — that path runs `prepare`→tsc with no
          # devDeps in the action checkout and fails on @types/node.
          argus-version: '0.5.0'
          # Review-only: kurultai's app is a CLI + axum daemon on ephemeral
          # ports — no per-PR web target, so the browser-flow lane is off.
          run: 'false'
          sandbox: 'false'

      - name: Upload argus-reviewer report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-reviewer-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: argus-reviewer-report/
          if-no-files-found: ignore
