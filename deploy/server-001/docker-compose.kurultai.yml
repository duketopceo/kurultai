name: kurultai

services:
  kurultai-personal:
    image: kurultai:solo
    container_name: kurultai-personal
    restart: unless-stopped
    environment:
      KURULTAI_ENV: prod
      KURULTAI_FEATURE_HUB: "0"
      KURULTAI_FEATURE_REMOTE_INGEST: "1"
      KURULTAI_HUB_BIND: all
      KURULTAI_HUB_AUTH: api_key
      # Contain agent-reachable writes in quarantine (agent_write_containment);
      # promote/touch/ontology writes gated behind the admin token.
      KURULTAI_FEATURE_SHARED_WRITE: "1"
      KURULTAI_ADMIN_TOKEN: ${PERSONAL_ADMIN_TOKEN:?missing PERSONAL_ADMIN_TOKEN — mint one, store omaseal kurultai/personal-admin-token, add to <repo>/.env}
      KURULTAI_HUB_API_KEYS: ${PERSONAL_API_KEYS:?missing PERSONAL_API_KEYS — run deploy/server-001/redeploy.sh (it passes --env-file <repo>/.env)}
      KURULTAI_MCP_HTTP_SECRET: ${PERSONAL_MCP_SECRET:?missing PERSONAL_MCP_SECRET — run deploy/server-001/redeploy.sh (it passes --env-file <repo>/.env)}
      KURULTAI_INGEST_SECRET: ${PERSONAL_INGEST_SECRET:?missing PERSONAL_INGEST_SECRET — run deploy/server-001/redeploy.sh (it passes --env-file <repo>/.env)}
      # Human login via Cloudflare Access (Google/OTP) — JWT verified against
      # the team domain certs; AUD = "Kurultai Personal" Access app tag.
      KURULTAI_CF_ACCESS_TEAM: duketopceo
      KURULTAI_CF_ACCESS_AUDS: 681b516695b2a7ff73edfb09e824e394a92fbdca62246b6d23f505badd3e28ca
      # Hey admin lane — verified CF Access emails get edit/delete + post-as-luke
      KURULTAI_ADMIN_EMAILS: duketopceo@gmail.com
      # pplx-embed backend ([embed] backend="perplexity" in /data config)
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PORT: "8421"
      HOME: /data
      RUST_LOG: "kurultai=info,error"
    volumes:
      - kurultai-personal-data:/data
      # Org checkouts for Brain Repos UI (lattice duketopceo/<repo>)
      - /home/khan/kurultai-repos:/data/repos:ro
    networks:
      - kurultai
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8421/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  kurultai-work:
    image: kurultai:solo
    container_name: kurultai-work
    restart: unless-stopped
    environment:
      KURULTAI_ENV: prod
      KURULTAI_FEATURE_HUB: "0"
      KURULTAI_HUB_BIND: all
      KURULTAI_HUB_AUTH: api_key
      KURULTAI_HUB_API_KEYS: ${WORK_API_KEYS:?missing WORK_API_KEYS — run deploy/server-001/redeploy.sh (it passes --env-file <repo>/.env)}
      KURULTAI_MCP_HTTP_SECRET: ${WORK_MCP_SECRET:?missing WORK_MCP_SECRET — run deploy/server-001/redeploy.sh (it passes --env-file <repo>/.env)}
      KURULTAI_INGEST_SECRET: ${WORK_INGEST_SECRET:?missing WORK_INGEST_SECRET — run deploy/server-001/redeploy.sh (it passes --env-file <repo>/.env)}
      KURULTAI_CF_ACCESS_TEAM: duketopceo
      KURULTAI_CF_ACCESS_AUDS: 4b8e471a751f46bdaa510b6662528279231d7d9cee00b8a75a93048b19444146
      # pplx-embed backend ([embed] backend="perplexity" in /data config)
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PORT: "8422"
      HOME: /data
      RUST_LOG: "kurultai=info,error"
    volumes:
      - kurultai-work-data:/data
    networks:
      - kurultai
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8422/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  landing:
    image: nginx:1.28-alpine
    container_name: landing
    restart: unless-stopped
    volumes:
      - ./landing/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - kurultai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Shared brain (hub). KURULTAI_FEATURE_HUB swaps the entire store to Postgres —
  # this is a separate container because there is no dual-lane mode (KTD2).
  # hub.shippedit.dev (humans, admin-scoped Access) + api-hub.shippedit.dev
  # (bearer hub keys) both point here — see docs/runbook-hub.md.
  kurultai-hub:
    image: kurultai:hub
    container_name: kurultai-hub
    restart: unless-stopped
    depends_on:
      kurultai-hub-db:
        condition: service_healthy
    environment:
      KURULTAI_ENV: prod
      KURULTAI_FEATURE_HUB: "1"
      KURULTAI_HUB_BIND: all
      KURULTAI_HUB_AUTH: api_key
      # Runtime DSN — kurultai_app (non-owner); RLS applies. Compose-internal.
      DATABASE_URL: postgres://kurultai_app:${KURULTAI_HUB_DB_PASSWORD:?missing KURULTAI_HUB_DB_PASSWORD — run deploy/server-001/redeploy.sh (it passes --env-file <repo>/.env)}@kurultai-hub-db:5432/kurultai
      # Admin/CLI DSN — kurultai_migrate (BYPASSRLS); used by `docker exec … kurultai hub …` runs (KTD8).
      KURULTAI_MIGRATE_DATABASE_URL: postgres://kurultai_migrate:${KURULTAI_HUB_MIGRATE_DB_PASSWORD:?missing KURULTAI_HUB_MIGRATE_DB_PASSWORD — run deploy/server-001/redeploy.sh (it passes --env-file <repo>/.env)}@kurultai-hub-db:5432/kurultai
      # App role never runs DDL — migrations go through the migrate DSN.
      KURULTAI_PG_SKIP_MIGRATE: "1"
      # /connect approver gate: verified CF Access email must appear in this list.
      KURULTAI_ADMIN_EMAILS: ${KURULTAI_ADMIN_EMAILS:?missing KURULTAI_ADMIN_EMAILS — add to <repo>/.env}
      # Admin-scoped Access app AUD tag(s) for hub./api-hub. hostnames.
      KURULTAI_CF_ACCESS_TEAM: duketopceo
      KURULTAI_CF_ACCESS_AUDS: ${HUB_CF_ACCESS_AUDS:?missing HUB_CF_ACCESS_AUDS — add the Access app AUD tag to <repo>/.env}
      PORT: "8423"
      HOME: /data
      RUST_LOG: "kurultai=info,error"
    networks:
      - kurultai
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8423/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Hub Postgres (pgvector). Compose-internal only — never published to the host.
  kurultai-hub-db:
    image: pgvector/pgvector:pg16
    container_name: kurultai-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kurultai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KURULTAI_HUB_DB_SUPERPASSWORD:?missing KURULTAI_HUB_DB_SUPERPASSWORD — run deploy/server-001/redeploy.sh (it passes --env-file <repo>/.env)}
    volumes:
      - kurultai-hub-pgdata:/var/lib/postgresql/data
    networks:
      - kurultai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kurultai"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


networks:
  kurultai:
    name: kurultai
    driver: bridge

volumes:
  kurultai-personal-data:
  kurultai-work-data:
  kurultai-hub-pgdata:
