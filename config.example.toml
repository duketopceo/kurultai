# Example Kurultai config. Copy to:
#   ~/.config/kurultai/config.toml
# or set KURULTAI_CONFIG=/path/to/config.toml
#
# API keys belong in the environment (see .env.example) — never in this file.
# Generate a real config with: kurultai init

environment = "dev"   # dev | staging | prod

[storage]
path = "~/.local/share/kurultai/dev/store.db"

# --- Sources (enable at least one) ------------------------------------------
# Solo shortcut: `kurultai init --docs` creates Documents/kurultai and enables notes.

[sources.notes]
enabled = true
kind = "markdown"                # dump formats: .md / .json / .jsonl / .ndjson / .txt
root_path = "/Users/you/Documents/notes"
poll_interval_secs = 60
# default_corpus_tier = "public"          # public | private (solo default: public)
# default_visibility_labels = "finance"  # comma-separated KTD15 labels
# default_visibility_scope = "personal"  # personal | team | company (solo default: personal)

# kb-it-docs: hashtag-line tags, no YAML frontmatter. Mark private for IT.
# [sources.it_docs]
# enabled = true
# kind = "markdown"
# root_path = "/path/to/kb-it-docs"
# default_corpus_tier = "private"
# default_visibility_labels = "it"
# default_visibility_scope = "team"  # personal | team | company
# Use ONE source per mixed folder (do not also point json/inbox at the same root).

[sources.data]
enabled = false
kind = "json"                    # dump formats: .json / .jsonl / .ndjson / .md / .txt
root_path = "/Users/you/data"
# Use ONE source per mixed folder (do not also point markdown/inbox at the same root).

[sources.inbox]
enabled = false
kind = "inbox"                   # dump tray: successes → processed/, failures → failed/
root_path = "/Users/you/kurultai-inbox"
# Offline: `kurultai index` drains the tray without the daemon.

[sources.dayflow]
enabled = false
kind = "dayflow"

[sources.pond]
enabled = false
kind = "pond"

[sources.code]
enabled = false
kind = "github"
root_path = "/Users/you/src/your-repo"

# --- Embeddings (OpenRouter — default with OPENROUTER_API_KEY set) ----------

[embed]
# One OPENROUTER_API_KEY (env) powers embeddings here and chat models below.
model = "openai/text-embedding-3-large"
dimension = 3072
# Local ONNX alternative (requires: cargo build --features local-embed).
# Replace the two lines above — do not leave conflicting model/dimension active:
# backend = "local"
# model = "AllMiniLML6V2"
# dimension = 384

# --- Runtime (rerank + search tuning) --------------------------------------

[runtime]
poll_interval_secs = 300
# Rerank top fused hits via OpenRouter (same API key as [embed]):
reranker_model = "openai/gpt-4o-mini"
# LLM `ask` also uses openai/gpt-4o-mini by default when the key is set.
# mcp_http_secret = "…"               # optional; prefer env KURULTAI_MCP_HTTP_SECRET
# nightly_full_sync_hour = 2          # local hour 0–23 for nightly full reindex
# inactivity_threshold_hours = 24     # skip poll when idle this many hours
# Hub mode (optional): prefer env KURULTAI_HUB_AUTH=api_key, KURULTAI_HUB_API_KEYS, KURULTAI_HUB_BIND=all
# Loopback dump ingest (POST /ingest) uses env KURULTAI_INGEST_SECRET only — no config key.
#
# Shared hub Postgres (HUB-2) is NOT selected by [storage].path / open_store.
# Build with --features postgres, set KURULTAI_FEATURE_HUB=1, then open via
# open_hub_store("postgres://…", embed_dim). One database per organization.
# Copy team/company atoms only — never personal, never in-place convert of store.db.

# --- CLI presentation -------------------------------------------------------

[cli]
# banner = "auto"   # true | false | "auto" (TTY only); suppressed by --plain / NO_COLOR / KURULTAI_PLAIN
