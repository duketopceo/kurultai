# Demo instance — fixture corpus only, loopback-bound, meant to sit behind
# a Cloudflare Tunnel + Access application. See demo/README.md for the
# tunnel/Access runbook. Real data never reaches this container.
#
#   CLOUDFLARED_TOKEN=<tunnel token> docker compose -f docker-compose.demo.yml up -d --build
#
# The tunnel token comes from the `kurultai-demo` named tunnel
# (cloudflared runs in-compose; only outbound 7844 is needed).
services:
  kurultai-demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    command: ["daemon", "--demo", "--port", "8421"]
    # Fixture corpus ships inside the image at /app/demo (built COPY);
    # this mount only overlays it read-only when developing locally.
    volumes:
      # HOME=/tmp for the nobody user — the demo store resolves under it.
      - demo-store:/tmp/.local/share/kurultai/demo
    environment:
      KURULTAI_DEMO_CONFIG: /app/demo/config.toml
      # Set these on the host to enable CF Access JWT verification:
      # KURULTAI_CF_ACCESS_TEAM / KURULTAI_CF_ACCESS_AUDS
      KURULTAI_CF_ACCESS_TEAM: ${KURULTAI_CF_ACCESS_TEAM:-}
      KURULTAI_CF_ACCESS_AUDS: ${KURULTAI_CF_ACCESS_AUDS:-}
    # No host port — reachable only on the compose network via cloudflared.
    expose:
      - "8421"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN}
    restart: unless-stopped
    depends_on:
      - kurultai-demo

volumes:
  demo-store:
