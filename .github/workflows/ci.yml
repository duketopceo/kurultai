name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: 0

jobs:
  agent-index:
    name: Agent index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit INDEX.md coverage
        run: python3 scripts/audit-agent-index.py

  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Unit & integration tests (nextest)
        run: cargo nextest run --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage report (informational, no fail gate)
        run: |
          cargo llvm-cov nextest --locked --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-html
          if-no-files-found: error

      - name: Release build
        run: cargo build --release --locked

  ui:
    name: Brain UI build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Layout math tests
        run: node --experimental-strip-types --test website/src/brain/layout/*.test.ts
      - name: Build website/ → ui/
        run: bash scripts/build-ui.sh
      - name: Embedded ui/ matches website source
        run: |
          git add -- ui/
          git diff --cached --exit-code -- ui/

  macos-smoke:
    name: macOS smoke
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Keep cargo test on macOS for a lighter smoke path (nextest lives on Linux Lint & Test).
      - name: Build & test
        run: |
          cargo test --locked
          cargo build --release --locked

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit

  postgres-store:
    name: Postgres store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kurultai
          POSTGRES_DB: kurultai_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kurultai -d kurultai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      KURULTAI_TEST_DATABASE_URL: postgres://kurultai@localhost:5432/kurultai_test
      KURULTAI_FEATURE_HUB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Clippy (postgres feature)
        run: cargo clippy --all-targets --features postgres -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Postgres store tests
        run: cargo nextest run --locked --features postgres

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build hub image
        run: docker build -t kurultai:smoke .

      - name: Smoke test binary
        run: docker run --rm kurultai:smoke --version
