# Build platform binaries and attach them to a GitHub Release.
# Triggers: push of a v* tag, or manual dispatch with a tag name.
name: Release Binaries

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: kurultai-windows-amd64.zip
            binary_name: kurultai.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: kurultai-macos-arm64.tar.gz
            binary_name: kurultai
          # Cross-compile Intel from Apple Silicon runners (macos-13 queue is scarce).
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: kurultai-macos-amd64.tar.gz
            binary_name: kurultai
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kurultai-linux-amd64.tar.gz
            binary_name: kurultai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" `
            -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf "${{ matrix.artifact_name }}" \
            -C "target/${{ matrix.target }}/release" \
            "${{ matrix.binary_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lah dist/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
