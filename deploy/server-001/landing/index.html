<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kurultai</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #15161a;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #8b5cf6;
      --border: #2a2d35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem;
    }
    h1 { font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    p.sub { color: var(--muted); margin-top: 0; margin-bottom: 2.5rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 720px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    .card p { margin: 0; color: var(--muted); line-height: 1.5; }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
    }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <h1>Kurultai</h1>
  <p class="sub">Choose an instance</p>
  <div class="grid">
    <a class="card" href="https://knowledge.shippedit.dev/ui/">
      <h2>Personal</h2>
      <p>Private knowledge brain for personal agents, notes, and memory.</p>
      <span class="badge">knowledge.shippedit.dev</span>
    </a>
    <a class="card" href="https://work.shippedit.dev/ui/">
      <h2>Work</h2>
      <p>Isolated work brain, projects, and professional agent coordination.</p>
      <span class="badge">work.shippedit.dev</span>
    </a>
  </div>
  <footer>shippedit.dev · API + MCP + Brain UI</footer>
</body>
</html>
