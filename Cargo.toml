[package]
name = "kurultai"
version = "0.3.0"
edition = "2021"
description = "Kurultai — a unified knowledge retrieval layer. Assemble what you know, from wherever it lives."
authors = ["Luke Kimball <duketopceo@gmail.com>"]
license = "MIT"
repository = "https://github.com/duketopceo/kurultai"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# HTTP client (for API calls, embedding endpoints)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# HTTP daemon (local brain API)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# SQLite with vector support (pin 0.1.6 — newer alphas fail to compile)
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tempfile = "3"
tar = "0.4"
flate2 = "1"
sqlite-vec = "=0.1.9"
zerocopy = "0.7"

# Content hashing for incremental index skip
sha2 = "0.11"

# Embeddings: OpenRouter by default; optional ONNX via feature `local-embed`

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"

# Config & paths
toml = "0.8"
dirs = "6"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# File watching for auto-indexing
notify = "8"

# Glob for file discovery
glob = "0.3"

# Unix open flags (O_NOFOLLOW) for connector path safety
libc = "0.2"
fastembed = { version = "5", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[features]
# Opt-in local ONNX embeddings (fastembed). Default builds stay FTS/cloud-only for CI.
local-embed = ["dep:fastembed"]
