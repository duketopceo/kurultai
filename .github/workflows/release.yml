name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: kurultai-windows-amd64.zip
            binary_name: kurultai.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: kurultai-macos-arm64.tar.gz
            binary_name: kurultai
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: kurultai-macos-amd64.tar.gz
            binary_name: kurultai
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kurultai-linux-amd64.tar.gz
            binary_name: kurultai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Binary (Windows)
        if: runner.os == "Windows"
        shell: powershell
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" `
            -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package Binary (Unix)
        if: runner.os != "Windows"
        run: |
          tar -czvf "${{ matrix.artifact_name }}" \
            -C "target/${{ matrix.target }}/release" \
            "${{ matrix.binary_name }}"

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
